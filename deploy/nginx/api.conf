# Подключается внутри server { … } для saywed.ru (и позже admin.saywed.ru): include /etc/nginx/snippets/saywed-api.conf;
# Зона лимита объявляется один раз в блоке http (например, в /etc/nginx/conf.d/saywed-limits.conf):
#   limit_req_zone $binary_remote_addr zone=saywed_public:10m rate=10r/m;

location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # API доверяет только этому заголовку: сам процесс слушает 127.0.0.1
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 32k;
}

location /api/public/ {
    limit_req zone=saywed_public burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 32k;
}
