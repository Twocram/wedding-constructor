dressCode:
  text: Мы будем рады, если вы поддержите палитру вечера — приглушённые, спокойные оттенки. Мужчинам подойдёт костюм без галстука, девушкам — платье миди или макси из струящихся тканей. Просим избегать белого и ярких принтов.
  colors: ["#1e1c1a", "#6b5d4f", "#a89a86", "#d9cfc0", "#f6f1ea"]
wishes:
  - Ваше присутствие — лучший подарок. Если хотите порадовать нас иначе, мы будем благодарны за вклад в наше свадебное путешествие.
  - Пожалуйста, без цветов — подарите им жизнь в саду, а нам — бутылку хорошего вина.
  - Мы любим ваших детей, но этот вечер задуман как праздник для взрослых.
transfer: В 14:45 от метро «Парк культуры» отправится автобус до ресторана. Обратно — в 00:00 и 01:00 до центра.
