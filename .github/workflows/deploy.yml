name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

# очередь, а не отмена: прерванный rsync --delete оставил бы на сервере половину релиза,
# а следующий запуск с фильтром путей мог бы его не передеплоить
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.filter.outputs.site }}
      api: ${{ steps.filter.outputs.api }}
      admin: ${{ steps.filter.outputs.admin }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            site:
              - 'apps/site/**'
              - 'packages/shared/**'
              - 'package-lock.json'
            api:
              - 'apps/api/**'
              - 'deploy/backup.sh'
              - 'packages/shared/**'
              - 'package-lock.json'
            admin:
              - 'apps/admin/**'
              # типы маршрутов API проверяются при сборке админки
              - 'apps/api/src/**'
              - 'packages/shared/**'
              - 'package-lock.json'

  site:
    needs: changes
    if: needs.changes.outputs.site == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_SITE_URL: https://saywed.ru
          # форма заявки включается переменной репозитория, когда API уже поднят на сервере
          PUBLIC_LEAD_FORM: ${{ vars.LEAD_FORM_ENABLED }}

      - name: Rsync dist to VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            apps/site/dist/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/wedding/"

  api:
    needs: changes
    # до первичной настройки сервера (deploy/README.md) задача выключена переменной репозитория
    if: vars.API_DEPLOY_ENABLED == 'true' && (needs.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # та же мажорная версия Node, что на сервере: от неё зависит бинарник better-sqlite3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck -w @saywed/api
      - run: npm run build:api

      - name: Assemble release
        run: |
          mkdir -p release
          cp -r apps/api/dist apps/api/drizzle deploy/backup.sh release/
          node -e "
            const { version } = require('./node_modules/better-sqlite3/package.json');
            const out = { name: 'saywed-api', private: true, type: 'module', dependencies: { 'better-sqlite3': version } };
            require('fs').writeFileSync('release/package.json', JSON.stringify(out, null, 2));
          "
          cd release && npm install --omit=dev --no-audit --no-fund

      - name: Rsync release and restart
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes"
          TARGET="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          rsync -az --delete -e "$SSH" release/ "$TARGET:/opt/saywed-api/"
          # миграции применяются при старте процесса
          $SSH "$TARGET" 'sudo systemctl restart saywed-api && for i in $(seq 1 20); do curl -fsS http://127.0.0.1:3000/api/health && exit 0; sleep 1; done; sudo journalctl -u saywed-api -n 50 --no-pager; exit 1'

  admin:
    # после API: новая админка не должна выйти раньше эндпоинтов, которые она зовёт
    needs: [changes, api]
    # включается после настройки admin.saywed.ru (deploy/README.md, раздел «Админка»)
    if: >-
      always() && vars.ADMIN_DEPLOY_ENABLED == 'true' &&
      (needs.api.result == 'success' || needs.api.result == 'skipped') &&
      (needs.changes.outputs.admin == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build:admin

      - name: Rsync dist to VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            apps/admin/dist/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/admin/"
