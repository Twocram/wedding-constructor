# Приглашения клиентов на поддоменах: <адрес>.saywed.ru → страница /<адрес>/ из той же сборки сайта.
# /etc/nginx/sites-available/invitations.saywed.ru → ln -s в sites-enabled.
# Сертификат *.saywed.ru — один на все поддомены, выпускается через DNS reg.ru (deploy/README.md):
# отдельные сертификаты попали бы в публичные журналы, и по ним нашлись бы адреса всех пар.
# admin.saywed.ru и www.saywed.ru описаны своими server с точным именем — у них приоритет над регуляркой.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ~^(?<slug>[a-z0-9][a-z0-9-]*)\.saywed\.ru$;

    ssl_certificate /etc/letsencrypt/wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/wildcard/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    root /var/www/wedding;
    include /etc/nginx/snippets/saywed-api.conf;

    add_header X-Robots-Tag "noindex" always;

    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex" always;
    }

    # общие файлы сайта: фото, музыка, календарь, превью для мессенджеров
    location ~ ^/(photos|music|ics|og)/ {
        try_files $uri =404;
    }

    # всё остальное — только страницы своего приглашения: главная и список ссылок для гостей
    location / {
        try_files /$slug${uri}index.html /$slug$uri/index.html =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name ~^(?<slug>[a-z0-9][a-z0-9-]*)\.saywed\.ru$;
    return 301 https://$host$request_uri;
}
