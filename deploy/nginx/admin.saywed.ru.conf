# /etc/nginx/sites-available/admin.saywed.ru → ln -s в sites-enabled, затем certbot --nginx -d admin.saywed.ru
server {
    listen 80;
    server_name admin.saywed.ru;

    root /var/www/admin;
    index index.html;

    # заголовки на уровне server: в location ниже нет своих add_header, поэтому они наследуются
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # шрифт Geist грузится с Google Fonts; inline-стили — у всплывающих элементов reka-ui и тостов
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    include /etc/nginx/snippets/saywed-api.conf;

    # файлы сборки с хешем в имени — кешируются навсегда
    location /assets/ {
        expires 1y;
    }

    # SPA: любой путь отдаёт index.html, сам index не кешируется — новая версия видна сразу
    location / {
        try_files $uri /index.html;
        expires -1;
    }
}
