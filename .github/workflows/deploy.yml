name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

# очередь, а не отмена: прерванный rsync --delete оставил бы на сервере половину релиза,
# а следующий запуск с фильтром путей мог бы его не передеплоить
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.filter.outputs.site }}
      api: ${{ steps.filter.outputs.api }}
      admin: ${{ steps.filter.outputs.admin }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            site:
              - 'apps/site/**'
              - 'packages/shared/**'
              - 'bun.lock'
            api:
              - 'apps/api/**'
              - 'deploy/backup.sh'
              - 'packages/shared/**'
              - 'bun.lock'
            admin:
              - 'apps/admin/**'
              # типы маршрутов API проверяются при сборке админки
              - 'apps/api/src/**'
              - 'packages/shared/**'
              - 'bun.lock'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck

  site:
    needs: [changes, lint]
    if: needs.changes.outputs.site == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # astro, vite и vue-tsc запускаются под Node
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          PUBLIC_SITE_URL: https://saywed.ru
          # форма заявки включается переменной репозитория, когда API уже поднят на сервере
          PUBLIC_LEAD_FORM: ${{ vars.LEAD_FORM_ENABLED }}

      - name: Rsync dist to VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            apps/site/dist/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/wedding/"

  api:
    needs: [changes, lint]
    # до первичной настройки сервера (deploy/README.md) задача выключена переменной репозитория
    if: vars.API_DEPLOY_ENABLED == 'true' && (needs.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile
      # один исполняемый файл с рантаймом Bun внутри — на сервере не нужны ни Bun, ни node_modules
      - run: bun run build:api

      # тот же бинарник, что уедет на сервер: health мало — минификация уже ломала авторизацию при живом /health
      - name: Smoke test binary
        run: |
          export DATABASE_PATH="$RUNNER_TEMP/smoke.db" MIGRATIONS_DIR=apps/api/drizzle PORT=3999
          apps/api/dist/saywed-api & pid=$!
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3999/api/health && break; sleep 0.5; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3999/api/auth/me)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3999/api/admin/stats)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:3999/api/public/leads)" = 422
          kill $pid

      - name: Assemble release
        run: |
          mkdir -p release
          cp apps/api/dist/saywed-api deploy/backup.sh release/
          cp -r apps/api/drizzle release/

      - name: Rsync release and restart
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes"
          TARGET="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          rsync -az --delete -e "$SSH" release/ "$TARGET:/opt/saywed-api/"
          # миграции применяются при старте процесса
          $SSH "$TARGET" 'sudo systemctl restart saywed-api && for i in $(seq 1 20); do curl -fsS http://127.0.0.1:3000/api/health && exit 0; sleep 1; done; sudo journalctl -u saywed-api -n 50 --no-pager; exit 1'

  admin:
    # после API: новая админка не должна выйти раньше эндпоинтов, которые она зовёт
    needs: [changes, lint, api]
    # включается после настройки admin.saywed.ru (deploy/README.md, раздел «Админка»)
    if: >-
      always() && vars.ADMIN_DEPLOY_ENABLED == 'true' && needs.changes.result == 'success' && needs.lint.result == 'success' &&
      (needs.api.result == 'success' || needs.api.result == 'skipped') &&
      (needs.changes.outputs.admin == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # astro, vite и vue-tsc запускаются под Node
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: bun install --frozen-lockfile
      - run: bun run build:admin

      - name: Rsync dist to VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            apps/admin/dist/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/admin/"
