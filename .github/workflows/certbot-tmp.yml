name: Temp certbot (jump host)

on: workflow_dispatch

jobs:
  certbot:
    runs-on: ubuntu-latest
    steps:
      - name: Issue certificate via SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "certbot --nginx -d saywed.ru -d www.saywed.ru --non-interactive --agree-tos --register-unsafely-without-email --redirect && certbot certificates"
