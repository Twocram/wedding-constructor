welcome: Самый важный день нашей жизни хотим провести с вами — нашими самыми дорогими людьми. Будет тёплый сентябрьский вечер, длинный стол в саду, музыка и много разговоров. Нам очень хочется, чтобы в этот день вы были рядом.
